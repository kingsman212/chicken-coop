server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Keamanan: sembunyikan versi nginx
    server_tokens off;

    # Keamanan: header tambahan
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Serve static assets langsung dari nginx (efisien)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Semua request lain diarahkan ke Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM: teruskan .php ke container app
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        # Path SCRIPT_FILENAME harus sesuai path di container app
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_intercept_errors on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_read_timeout 60;
    }

    # Blokir akses ke file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Error pages
    error_page 404 /index.php;
    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
