# ── Listener MQTT ──────────────────────────────────────────────
listener 1883 0.0.0.0

# ── Akses MQTT ────────────────────────────────────────────────
# Default: allow_anonymous true agar startup mulus.
# Untuk mengaktifkan proteksi password, jalankan: bash scripts/setup-mqtt-auth.sh
allow_anonymous true

# ── Logging ────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice

