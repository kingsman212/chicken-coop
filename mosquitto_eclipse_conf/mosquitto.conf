# ── Listener MQTT ──────────────────────────────────────────────
listener 1883 0.0.0.0

# ── Akses MQTT ────────────────────────────────────────────────
# Default: allow_anonymous true agar startup mulus.
# Untuk mengaktifkan proteksi password, jalankan: bash scripts/setup-mqtt-auth.sh
allow_anonymous true

# ── $SYS Topic (untuk mosquitto-exporter metrics) ──────────────
# Interval (detik) publikasi statistik broker ke topik $SYS/#
# Diperlukan oleh sapcc/mosquitto-exporter agar bisa scrape metrics
sys_interval 10

# ── Logging ────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
