# ── Listener MQTT ──────────────────────────────────────────────
listener 1883 0.0.0.0

# ── Keamanan: Autentikasi Wajib ───────────────────────────────
# Semua client (ESP8266 & Laravel) harus login dengan username/password
allow_anonymous false
password_file /mosquitto/config/passwd

# ── Logging ────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
