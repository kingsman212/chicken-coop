version: '3.8'

services:
  # ── Database Service (MySQL 8.0) ────────────────────────────
  db:
    image: mysql:8.0
    container_name: chicken_coop_db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_chicken_choop}
      MYSQL_USER: ${MYSQL_USER:-smartcoop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-userpassword}
    # Port 3306 tidak diekspos ke host — komunikasi internal Docker saja
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ── MQTT Broker (Eclipse Mosquitto) ────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: chicken_coop_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT standard (ESP8266 & Laravel)
    volumes:
      - ./mosquitto_eclipse_conf/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # ── Laravel PHP-FPM Application ────────────────────────────
  app:
    build:
      context: ./chicken-choop
      dockerfile: Dockerfile
    container_name: chicken_coop_app
    restart: unless-stopped
    env_file:
      - .env.docker
    # Port 9000 (PHP-FPM) tidak diekspos ke luar — nginx yang menjadi proxy
    expose:
      - "9000"
    volumes:
      - public_assets:/shared/public
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ── Nginx Web Server ───────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: chicken_coop_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets:/var/www/html/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  # ── MQTT Background Listener Worker ───────────────────────
  mqtt-worker:
    build:
      context: ./chicken-choop
      dockerfile: Dockerfile
    container_name: chicken_coop_mqtt_worker
    restart: unless-stopped
    command: ["php", "artisan", "mqtt:listen"]
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ── phpMyAdmin (Database Management Tool) ──────────────────
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: chicken_coop_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"   # Akses phpMyAdmin di http://<IP_SERVER>:8080
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

  # ── Node Exporter (EC2 Host Metrics Collector) ─────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: chicken_coop_node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # ── Mosquitto Exporter (MQTT Broker & Traffic Metrics) ────
  mosquitto-exporter:
    image: sapcc/mosquitto-exporter:latest
    container_name: chicken_coop_mosquitto_exporter
    restart: unless-stopped
    environment:
      - BROKER_ENDPOINT=tcp://mosquitto:1883
      - MQTT_USERNAME=${MQTT_USERNAME:-laravel_worker}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-rezatugasakhir09}
    expose:
      - "9234"
    ports:
      - "9234:9234"
    depends_on:
      - mosquitto


  # ── Prometheus (Metrics Time-Series Database & Scraper) ────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: chicken_coop_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    expose:
      - "9090"
    ports:
      - "9090:9090"   # Akses web Prometheus UI di http://<IP_SERVER>:9090 (opsional)
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - mosquitto-exporter

  # ── Grafana (Monitoring Dashboard Website) ──────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: chicken_coop_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"   # Akses Dashboard Grafana di http://<IP_SERVER>:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  db_data:
  mosquitto_data:
  mosquitto_log:
  public_assets:
  prometheus_data:
  grafana_data:
