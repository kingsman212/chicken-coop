---
- name: Deploy SmartCoop Docker Application to AWS EC2
  hosts: ec2
  become: yes
  vars:
    project_dir: "/home/{{ ansible_user }}/smartcoop"

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - rsync
          - git
        state: present

    - name: Create directory for Docker keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add remote user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Create application target directory on EC2
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy project files to EC2 (Excluding firmware folder)
      synchronize:
        src: "../"
        dest: "{{ project_dir }}/"
        rsync_opts:
          - "--exclude=firmware"
          - "--exclude=.git"
          - "--exclude=ansible"
          - "--exclude=chicken-choop/node_modules"
          - "--exclude=chicken-choop/vendor"
          - "--exclude=chicken-choop/public/build"
      become: false

    - name: Ensure entrypoint and helper scripts have execution permissions
      file:
        path: "{{ item }}"
        mode: '0755'
      with_fileglob:
        - "{{ project_dir }}/chicken-choop/docker-entrypoint.sh"
        - "{{ project_dir }}/scripts/*.sh"
      become: false

    - name: Ensure mosquitto passwd placeholder exists
      file:
        path: "{{ project_dir }}/mosquitto_eclipse_conf/passwd"
        state: touch
        mode: '0644'
      become: false

    - name: Check if .env.docker exists on EC2
      stat:
        path: "{{ project_dir }}/.env.docker"
      register: env_docker_stat
      become: false

    - name: Create .env.docker from example if not present
      copy:
        src: "{{ project_dir }}/.env.docker.example"
        dest: "{{ project_dir }}/.env.docker"
        remote_src: yes
        mode: '0600'
      when: not env_docker_stat.stat.exists
      become: false

    - name: Deploy application containers with Docker Compose
      command: docker compose up -d --build
      args:
        chdir: "{{ project_dir }}"
      become: false

    - name: Check container status
      command: docker compose ps
      args:
        chdir: "{{ project_dir }}"
      register: compose_status
      become: false

    - name: Show deployment results
      debug:
        msg: "{{ compose_status.stdout_lines }}"
